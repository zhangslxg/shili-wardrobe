<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0910">
<meta name="robots" content="noindex">
<title>图片预览 · 衣橱</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 快速预览页（开发用，正式上线前删除本页与 images/ 即可） ============ -->
<section id="preview" class="screen pv active">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7.6a2 2 0 1 1 2-2c0 1.1-2 1.9-2 3.2"/>
          <path d="M12 8.9 3.6 16.7a1.4 1.4 0 0 0 1 2.3h14.8a1.4 1.4 0 0 0 1-2.3z"/>
        </svg>
      </span>
      <span class="brand-name">图片预览</span>
    </div>
    <span class="pv-count" id="pv-count">1 / 8</span>
  </header>

  <!-- 单图查看区：整页只显示一张，左右滑动 / 拖拽 / 方向键 / 箭头按钮切换 -->
  <div class="pv-stage" id="pv-stage">
    <div class="pv-track" id="pv-track">
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_001.jpg" alt="主图_001" draggable="false" decoding="async"></div>
        <figcaption>主图_001.jpg · 864×864</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_002.jpg" alt="主图_002" draggable="false" decoding="async"></div>
        <figcaption>主图_002.jpg · 800×800</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_003.jpg" alt="主图_003" draggable="false" decoding="async"></div>
        <figcaption>主图_003.jpg · 864×1184</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_004.jpg" alt="主图_004" draggable="false" decoding="async"></div>
        <figcaption>主图_004.jpg · 1122×1500</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_005.jpg" alt="主图_005" draggable="false" decoding="async"></div>
        <figcaption>主图_005.jpg · 864×1184</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_006.jpg" alt="主图_006" draggable="false" decoding="async"></div>
        <figcaption>主图_006.jpg · 864×1184</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/主图_007.jpg" alt="主图_007" draggable="false" decoding="async"></div>
        <figcaption>主图_007.jpg · 864×1184</figcaption>
      </figure>
      <figure class="pv-slide">
        <div class="pv-imgwrap"><img src="images/缩略图_001.jpg" alt="缩略图_001" draggable="false" decoding="async"></div>
        <figcaption>缩略图_001.jpg · 800×800</figcaption>
      </figure>
    </div>

    <button class="iconbtn pv-nav pv-prev" id="pv-prev" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="iconbtn pv-nav pv-next" id="pv-next" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div class="swipe-hint" id="pv-hint">← 左右滑动切换图片 →</div>
  </div>

  <footer class="pv-bar">
    <p class="pv-note">影楼新款个人肖像主题写真 · 共 8 张，按原始比例显示，未做裁剪。本页为临时预览，不参与 App 路由；图片位于 <code>images/</code> 目录，替换 / 删除文件后刷新本页即可看到变化。</p>
  </footer>
</section>

<script>
(function () {
  var stage = document.getElementById('pv-stage');
  var track = document.getElementById('pv-track');
  var count = document.getElementById('pv-count');
  var prevBtn = document.getElementById('pv-prev');
  var nextBtn = document.getElementById('pv-next');
  var hint = document.getElementById('pv-hint');
  var total = track.querySelectorAll('.pv-slide').length;
  var index = 0;
  var dragging = false, decided = false, horizontal = false;
  var startX = 0, startY = 0, dx = 0;

  function render(animate) {
    track.classList.toggle('pv-anim', animate !== false);
    track.style.transform = 'translateX(' + (-index * 100) + '%)';
    count.textContent = (index + 1) + ' / ' + total;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === total - 1;
  }
  function go(i) {
    index = Math.max(0, Math.min(total - 1, i));
    if (index > 0 && hint) hint.classList.add('hide');
    render(true);
  }

  prevBtn.addEventListener('click', function () { go(index - 1); });
  nextBtn.addEventListener('click', function () { go(index + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(index - 1);
    else if (e.key === 'ArrowRight') go(index + 1);
  });

  /* 指针拖拽：一套事件同时覆盖触摸屏与鼠标，横向位移占主导才判定为翻页手势 */
  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; decided = false; horizontal = false;
    startX = e.clientX; startY = e.clientY; dx = 0;
    track.classList.remove('pv-anim');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var mx = e.clientX - startX, my = e.clientY - startY;
    if (!decided) {
      if (Math.abs(mx) < 6 && Math.abs(my) < 6) return;
      decided = true;
      horizontal = Math.abs(mx) > Math.abs(my);
      if (horizontal) e.preventDefault();
    }
    if (!horizontal) return;
    dx = mx;
    /* 边缘阻尼：第一张继续右拖、最后一张继续左拖时只跟随一半距离 */
    if ((index === 0 && dx > 0) || (index === total - 1 && dx < 0)) dx *= 0.35;
    track.style.transform = 'translateX(calc(' + (-index * 100) + '% + ' + dx + 'px))';
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    var threshold = Math.min(120, stage.clientWidth * 0.2);
    if (horizontal && Math.abs(dx) > threshold) {
      go(index + (dx < 0 ? 1 : -1));
    } else {
      render(true);
    }
    dx = 0;
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  render(false);
})();
</script>

</body>
</html>
