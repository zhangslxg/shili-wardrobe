name: 部署到 GitHub Pages

# 触发方式：main 分支推送自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需最小权限（官方推荐配置）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，新的取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态产物（整个目录原样上传，无构建步骤）
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        uses: actions/deploy-pages@v4
        id: deployment
