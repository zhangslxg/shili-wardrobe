<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0910">
<title>离线提示 · 石榴照相馆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(110% 80% at 50% 32%, #22184A 0%, transparent 60%),
      radial-gradient(120% 90% at 50% 30%, #1D1436 0%, #0B0910 62%);
    color:#ECE9F5;
    font-family:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;
  }
  .card{max-width:320px}
  .logo{
    width:84px;height:84px;border-radius:26px;margin:0 auto 26px;
    background:linear-gradient(155deg,#8B5CF6 0%,#6D28D9 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(167,139,250,.35),0 12px 48px rgba(139,92,246,.45);
  }
  .logo svg{width:44px;height:44px}
  h1{font-size:22px;font-weight:700;letter-spacing:2px;margin-bottom:12px}
  p{font-size:14px;line-height:1.8;color:#A79FC2;margin-bottom:10px}
  .tip{
    display:inline-block;font-size:12.5px;color:#8B5CF6;
    background:rgba(139,92,246,.12);border:1px solid rgba(109,40,217,.5);
    border-radius:999px;padding:5px 14px;margin-top:6px;
  }
  button{
    margin-top:26px;height:46px;padding:0 34px;border:none;border-radius:14px;
    background:linear-gradient(150deg,#8B5CF6,#6D28D9);color:#fff;
    font-family:inherit;font-size:15px;font-weight:500;letter-spacing:2px;cursor:pointer;
    box-shadow:0 8px 28px rgba(139,92,246,.4);
  }
  button:active{transform:scale(.96)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7.6a2 2 0 1 1 2-2c0 1.1-2 1.9-2 3.2"/>
        <path d="M12 8.9 3.6 16.7a1.4 1.4 0 0 0 1 2.3h14.8a1.4 1.4 0 0 0 1-2.3z"/>
      </svg>
    </div>
    <h1>网络开小差了</h1>
    <p>当前处于离线状态，且这是第一次打开，本地还没有缓存内容。</p>
    <p>已浏览过的内容不依赖网络，可直接打开；新衣服需要联网后刷新才能看到。</p>
    <span class="tip">回到店内 Wi-Fi 或恢复网络后重试</span>
    <br>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
